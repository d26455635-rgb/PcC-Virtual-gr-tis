name: Criar PC Virtual Gaming Azure

on:
  workflow_dispatch:

jobs:
  criar-vm:
    runs-on: ubuntu-latest

    steps:

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Criar VM Gaming
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |

            # ================================
            # CONFIGURAÇÕES
            # ================================

            RESOURCE_GROUP="GamingVM"
            LOCATION="eastus"
            VM_NAME="GamingPC"
            ADMIN_USER="gamer"
            VM_SIZE="Standard_NV36ads_A10_v5"

            IMAGE="MicrosoftWindowsDesktop:Windows-11:win11-25h2-ent:latest"

            # ================================
            # 1. RESOURCE GROUP
            # ================================

            az group create \
              --name "$RESOURCE_GROUP" \
              --location "$LOCATION"

            # ================================
            # 2. CRIAR VM
            # ================================

            az vm create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$VM_NAME" \
              --location "$LOCATION" \
              --size "$VM_SIZE" \
              --image "$IMAGE" \
              --admin-username "$ADMIN_USER" \
              --admin-password "${{ secrets.VM_PASSWORD }}" \
              --public-ip-sku Standard \
              --storage-sku Premium_LRS \
              --os-disk-size-gb 512 \
              --security-type Standard \
              --nic-delete-option Delete \
              --os-disk-delete-option Delete

            # ================================
            # 3. INSTALAR DRIVER NVIDIA
            # ================================

            az vm extension set \
              --resource-group "$RESOURCE_GROUP" \
              --vm-name "$VM_NAME" \
              --name NvidiaGpuDriverWindows \
              --publisher Microsoft.HpcCompute \
              --version 1.10 \
              --settings '{}'

            # ================================
            # 4. LIBERAR RDP
            # ================================

            az vm open-port \
              --resource-group "$RESOURCE_GROUP" \
              --name "$VM_NAME" \
              --port 3389

            # ================================
            # 5. MOSTRAR IP
            # ================================

            IP=$(az vm show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$VM_NAME" \
              --show-details \
              --query publicIps \
              --output tsv)

            echo "================================"
            echo "VM CRIADA COM SUCESSO"
            echo "================================"
            echo "Nome: $VM_NAME"
            echo "IP: $IP"
            echo "Usuário: $ADMIN_USER"
            echo "GPU: NVIDIA A10"
            echo "================================"
